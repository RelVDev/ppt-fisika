<style>

.bar{left:91.2px;top:225.05px;width:1737.6px;height:69.66px}

.bar b{position:absolute;top:0;line-height:61.7px;font-size:28.9px;font-weight:700;color:rgba(255,255,255,.85)}

.g{position:absolute;left:109.2px;top:350.7px;width:1701.6px;height:664.6px;display:grid;grid-template-columns:repeat(12,1fr);gap:18px;z-index:2}

#ch{width:100%;height:100%}#ch svg{width:100%;height:100%;display:block}

</style></head><body>
<div id="st">
<svg class="dc" style="left:-34px;top:138px"><path d="M8 70q15-60 30-15t30 0 30-10 30 5 24-18"/></svg>
<svg class="dc" style="left:1740px;top:-34px"><path d="M8 70q15-60 30-15t30 0 30-10 30 5 24-18"/></svg>
<div class="ti d" id="ti"></div>
<div class="bar gl"><b class="ic">&lt;/&gt;</b><b class="lb" id="lb"></b><b class="no" id="no"></b><i class="dt" style="left:1521px;background:#C30E0E"></i><i class="dt" style="left:1585px;background:#F4E02B"></i><i class="dt" style="left:1648.7px;background:#19BD29"></i></div>
<div class="wb gl"></div>
<div class="g"><div class="c s8"><div id="ch"></div></div><div class="c s4"><div id="cl"></div><button class="pp" id="pp">Jeda</button><div id="rd"></div></div></div>
<nav id="nv"></nav>
</div>
<script>
const W=1076,$=id=>document.getElementById(id),M=Math,PI=M.PI,g0=9.81;
const n=(x,d=2)=>(+x).toFixed(d).replace('.',',');
// subplot: kurva terhadap waktu + titik penanda berjalan
function sp(y0,h,Tw,ya,S,lab,t,ex,x0=70){const m=h/2-12,cy=y0+h/2,X=u=>x0+(W-30-x0)*u/Tw,Y=s=>cy-m*s/ya,tt=t%Tw;
return `<rect x="${x0}" y="${y0}" width="${W-30-x0}" height="${h}" fill="none" stroke="#fff" stroke-opacity=".25"/><line x1="${x0}" x2="${W-30}" y1="${cy}" y2="${cy}" stroke="#E0E0E0" stroke-opacity=".55"/><text x="${x0+8}" y="${y0+28}" style="font-size:24px">${lab}</text><text x="${W-60}" y="${cy-8}" style="font-size:24px">t</text>${ex?ex(X,Y):''}`+
S.map(s=>{let d='',p=0;for(let i=0;i<=220;i++){const y=s.f(Tw*i/220);if(isNaN(y)){p=0;continue}d+=(p?'L':'M')+X(Tw*i/220).toFixed(1)+' '+Y(y).toFixed(1);p=1}
const yy=s.f(tt);return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||4}" ${s.d?'stroke-dasharray="10 8"':''}/>`+(s.n||isNaN(yy)?'':`<circle cx="${X(tt)}" cy="${Y(yy)}" r="9" fill="${s.c}"/>`)}).join('')}
const Au='#FFB800',Or='#FFA629',Gr='#0DFF00',Rd='#FF1F00';
const C=cache={};
const PG=[
{t:'GHS: AMPLITUDO TAK UBAH T',l:'GHS · PEGAS-MASSA',
v:[['m','Massa m (kg)',.1,5,1,.1],['k','Konstanta k (N/m)',5,100,20,1],['A','Amplitudo A (cm)',2,18,10,1],['d','Fase awal δ (rad)',-3.14,3.14,0,.01]],
draw(t,v){const w=M.sqrt(v.k/v.m),T=2*PI/w,A=v.A,x=s=>A*M.cos(w*s+v.d),px=540+x(t)*18,x1=px-45;let z='M90 60';for(let i=1;i<=14;i++)z+=`L${90+(x1-90)*i/14} ${60+(i%2&&i<14?-22:i<14?22:0)}`;
return `<rect x="66" y="16" width="16" height="88" fill="#E0E0E0"/><path d="${z}" fill="none" stroke="#fff" stroke-width="4"/><rect x="${x1}" y="25" width="90" height="70" rx="8" fill="${Au}"/><line x1="540" x2="540" y1="108" y2="118" stroke="${Or}" stroke-width="3"/>`+
sp(122,150,3*T,A,[{f:s=>x(s),c:Au}],'x (cm)',t)+sp(284,150,3*T,w*A/100,[{f:s=>-w*A/100*M.sin(w*s+v.d),c:'#fff'}],'v (m/s)',t)+sp(446,150,3*T,w*w*A/100,[{f:s=>-w*w*A/100*M.cos(w*s+v.d),c:Or}],'a (m/s²)',t)},
rd(v){const w=M.sqrt(v.k/v.m);return `ω = <b>${n(w)}</b> rad/s<br>f = <b>${n(w/2/PI)}</b> Hz<br>T = <b>${n(2*PI/w)}</b> s<br>v<sub>maks</sub> = ωA = <b>${n(w*v.A/100,3)}</b> m/s<br>Ubah A: T tetap.`}},
{t:'GHS = PROYEKSI LINGKARAN',l:'GHS · GERAK MELINGKAR',
v:[['A','Jari-jari A (cm)',2,10,8,.5],['w','Frekuensi sudut ω (rad/s)',.5,6,2,.1],['d','Fase awal δ (rad)',-3.14,3.14,0,.01]],
draw(t,v){const w=v.w,T=2*PI/w,R=17*v.A,th=w*t+v.d,px=200+R*M.sin(th),py=310-R*M.cos(th),Tw=2*T,X=420+(W-450)*(t%Tw)/Tw;
return `<circle cx="200" cy="310" r="${R}" fill="none" stroke="#E0E0E0" stroke-opacity=".6" stroke-width="2"/><line x1="200" x2="200" y1="110" y2="510" stroke="#E0E0E0" stroke-opacity=".5" stroke-dasharray="6 8"/>`+
sp(128,364,Tw,10,[{f:s=>v.A*M.cos(w*s+v.d),c:Au}],'x(t) = A cos(ωt + δ)',t,null,420)+
`<line x1="200" y1="310" x2="${px}" y2="${py}" stroke="#fff" stroke-width="4"/><line x1="${px}" y1="${py}" x2="${X}" y2="${py}" stroke="${Or}" stroke-width="3" stroke-dasharray="8 8"/><circle cx="${px}" cy="${py}" r="11" fill="${Au}"/>`},
rd(v,t){const th=v.w*t+v.d;return `T = 2π/ω = <b>${n(2*PI/v.w)}</b> s<br>f = <b>${n(v.w/2/PI)}</b> Hz<br>x = <b>${n(v.A*M.cos(th))}</b> cm<br>v = <b>${n(-v.w*v.A*M.sin(th)/100,3)}</b> m/s`}},
{t:'ENERGI TOTAL SELALU KEKAL',l:'GHS · ENERGI MEKANIK',
v:[['k','Konstanta k (N/m)',10,200,50,1],['A','Amplitudo A (cm)',2,20,10,1],['m','Massa m (kg)',.1,5,1,.1]],
draw(t,v){const w=M.sqrt(v.k/v.m),T=2*PI/w,a=v.A/100,E=.5*v.k*a*a,x=s=>a*M.cos(w*s),U=s=>.5*v.k*x(s)**2,X=q=>538+470*q/a,Y=e=>340-300*e/E,xc=x(t),Uc=U(t);
let d='';for(let i=0;i<=60;i++){const q=-a+2*a*i/60;d+=(i?'L':'M')+X(q)+' '+Y(.5*v.k*q*q)}
return `<line x1="60" x2="1020" y1="340" y2="340" stroke="#E0E0E0" stroke-opacity=".6"/><path d="${d}" fill="none" stroke="#fff" stroke-width="4"/><line x1="60" x2="1020" y1="${Y(E)}" y2="${Y(E)}" stroke="${Or}" stroke-width="3" stroke-dasharray="10 8"/><text x="70" y="${Y(E)-10}" style="fill:${Or};font-size:24px">E = ½kA²</text>
<line x1="${X(xc)}" x2="${X(xc)}" y1="340" y2="${Y(Uc)}" stroke="${Au}" stroke-width="10"/><line x1="${X(xc)}" x2="${X(xc)}" y1="${Y(Uc)}" y2="${Y(E)}" stroke="${Gr}" stroke-width="10"/><circle cx="${X(xc)}" cy="${Y(Uc)}" r="12" fill="#fff"/><text x="70" y="372" style="font-size:24px">−A</text><text x="990" y="372" style="font-size:24px">+A</text><text x="500" y="372" style="font-size:24px;fill:${Au}">U emas · K hijau</text>`+
sp(400,210,2*T,1,[{f:s=>2*U(s)/E-1,c:Au},{f:s=>1-2*U(s)/E,c:Gr},{f:s=>0,c:Or,d:1,n:1}],'U, K, E terhadap waktu',t)},
rd(v,t){const w=M.sqrt(v.k/v.m),a=v.A/100,E=.5*v.k*a*a,U=E*M.cos(w*t)**2;return `E = <b>${n(E,4)}</b> J<br>U = <b>${n(U,4)}</b> J<br>K = <b>${n(E-U,4)}</b> J<br>v<sub>maks</sub> = <b>${n(w*a,3)}</b> m/s<br>U<sub>rata</sub> = K<sub>rata</sub> = <b>${n(E/2,4)}</b> J`}},
{t:'SUDUT BESAR, PERIODE LEBIH LAMA',l:'VARIASI · BANDUL MATEMATIS',
v:[['L','Panjang tali L (m)',.2,3,1,.05],['p','Sudut awal φ₀ (°)',5,170,30,1],['g','Gravitasi g (m/s²)',1.6,24.8,9.81,.01]],
draw(t,v){const k=[v.L,v.p,v.g].join(),w=M.sqrt(v.g/v.L);let c=C[k];if(!c){const T0=2*PI/w,p0=v.p*PI/180;let a=1,b=M.cos(p0/2);for(let i=0;i<9;i++){const q=(a+b)/2;b=M.sqrt(a*b);a=q}const Te=T0/a,Tw=3*Te,N=3000,dt=Tw/N,r=[];let th=p0,om=0,ac=-w*w*M.sin(th);for(let i=0;i<=N;i++){r.push(th);th+=om*dt+.5*ac*dt*dt;const an=-w*w*M.sin(th);om+=.5*(ac+an)*dt;ac=an}c=C[k]={T0,Te,Tw,r,dt,p0}}
const ex=s=>c.r[M.min(3000,M.round(s/c.dt))],ap=s=>c.p0*M.cos(w*s),th=ex(t%c.Tw),ta=ap(t%c.Tw),bx=(q)=>300+230*M.sin(q),by=q=>30+230*M.cos(q);
return `<circle cx="300" cy="30" r="8" fill="#E0E0E0"/><line x1="300" y1="30" x2="${bx(ta)}" y2="${by(ta)}" stroke="#fff" stroke-opacity=".5" stroke-dasharray="6 6" stroke-width="3"/><circle cx="${bx(ta)}" cy="${by(ta)}" r="22" fill="none" stroke="#fff" stroke-width="3"/><line x1="300" y1="30" x2="${bx(th)}" y2="${by(th)}" stroke="#fff" stroke-width="4"/><circle cx="${bx(th)}" cy="${by(th)}" r="22" fill="${Au}"/><text x="620" y="110">emas: persamaan eksak</text><text x="620" y="150">putih: sudut kecil (sin φ ≈ φ)</text>`+
sp(300,310,c.Tw,v.p,[{f:s=>ex(s)*180/PI,c:Au},{f:s=>ap(s)*180/PI,c:'#fff',d:1,n:1}],'φ (derajat)',t)},
rd(v){const k=[v.L,v.p,v.g].join(),c=C[k];if(!c)return'';return `T<sub>0</sub> = 2π‹L/g› = <b>${n(c.T0,3)}</b> s<br>T eksak = <b>${n(c.Te,3)}</b> s<br>Selisih = <b>${n((c.Te/c.T0-1)*100,1)}%</b><br>Sudut kecil → selisih ≈ 0`.replace('‹L/g›','√(L/g)')}},
{t:'BENDA TEGAR IKUT BERGETAR',l:'OSILASI · BANDUL FISIS &amp; PUNTIR',
v:[['R','Jari-jari cincin R (m)',.1,1.5,.5,.05],['I','Momen inersia I (kg·m²)',.01,.5,.1,.01],['ka','Konstanta puntir κ (N·m/rad)',.01,1,.2,.01]],
draw(t,v){const T1=2*PI*M.sqrt(2*v.R/g0),T2=2*PI*M.sqrt(v.I/v.ka),Tw=3*M.max(T1,T2);
return sp(10,290,Tw,15,[{f:s=>15*M.cos(2*PI*s/T1),c:Au}],'Cincin diputar di tepi (bandul fisis), φ (°)',t)+sp(316,290,Tw,15,[{f:s=>15*M.cos(2*PI*s/T2),c:'#fff'}],'Bandul puntir, φ (°)',t)},
rd(v){const T1=2*PI*M.sqrt(2*v.R/g0),T2=2*PI*M.sqrt(v.I/v.ka);return `Cincin: I = 2MR²<br>T = 2π√(2R/g) = <b>${n(T1,3)}</b> s<br>Puntir: T = 2π√(I/κ)<br>T = <b>${n(T2,3)}</b> s`}},
{t:'REDAMAN MELURUHKAN AMPLITUDO',l:'OSILASI · TEREDAM',
v:[['m','Massa m (kg)',.1,5,1,.1],['k','Konstanta k (N/m)',5,100,20,1],['b','Redaman b (kg/s)',0,30,1.5,.1]],
draw(t,v){const w0=M.sqrt(v.k/v.m),z=v.b/(2*M.sqrt(v.k*v.m)),gm=v.b/(2*v.m);
const x=s=>{if(z<.9999){const w=w0*M.sqrt(1-z*z);return M.exp(-gm*s)*(M.cos(w*s)+gm/w*M.sin(w*s))}if(z<1.0001)return M.exp(-w0*s)*(1+w0*s);const q=w0*M.sqrt(z*z-1),r1=-gm+q,r2=-gm-q;return(r2*M.exp(r1*s)-r1*M.exp(r2*s))/(r2-r1)};
const E=s=>{const h=1e-4,vv=(x(s+h)-x(s-h))/(2*h);return(v.k*x(s)**2+v.m*vv*vv)/v.k};
return sp(10,290,8,1,[{f:x,c:Au},{f:s=>z<1?M.exp(-gm*s):NaN,c:Or,d:1,n:1,w:3},{f:s=>z<1?-M.exp(-gm*s):NaN,c:Or,d:1,n:1,w:3}],'x/A  (garis putus-putus: envelope Ae^(−bt/2m))',t)+
sp(316,290,8,1,[{f:s=>2*E(s)-1,c:'#fff'},{f:s=>2*M.exp(-v.b*s/v.m)-1,c:Or,d:1,n:1,w:3}],'E/E₀  (putus-putus: e^(−bt/m))',t)},
rd(v){const w0=M.sqrt(v.k/v.m),z=v.b/(2*M.sqrt(v.k*v.m));return `ω<sub>0</sub> = <b>${n(w0)}</b> rad/s<br>ζ = b/(2√(km)) = <b>${n(z)}</b><br><b>${z<.9999?'Redaman ringan':z<1.0001?'Redaman kritis':'Redaman berlebih'}</b><br>${z<1&&v.b>0?`ω = <b>${n(w0*M.sqrt(1-z*z))}</b> rad/s<br>Q = ω₀m/b = <b>${n(w0*v.m/v.b,1)}</b>`:'Tidak berosilasi'}`}},
{t:'RESONANSI: ω MENDEKATI ω₀',l:'OSILASI · TERPAKSA',
v:[['b','Redaman b (kg/s)',.1,3,.5,.05],['r','Rasio ω/ω₀',.2,2.2,.8,.01],['F','Gaya F₀ (N)',1,10,4,.5]],
draw(t,v){const w0=2,Af=r=>v.F/M.sqrt((4-(r*w0)**2)**2+(v.b*r*w0)**2);let mx=0,d='';for(let i=0;i<=200;i++)mx=M.max(mx,Af(2.5*i/200));
const X=r=>70+(W-100)*r/2.5,Y=a=>330-300*a/mx;for(let i=0;i<=200;i++){const r=2.5*i/200;d+=(i?'L':'M')+X(r)+' '+Y(Af(r))}
const w=v.r*w0,A=Af(v.r),dl=M.atan2(v.b*w,4-w*w),Tw=4*2*PI/w,ya=M.max(A,v.F/4);
return `<rect x="70" y="30" width="${W-100}" height="300" fill="none" stroke="#fff" stroke-opacity=".25"/><line x1="${X(1)}" x2="${X(1)}" y1="30" y2="330" stroke="${Or}" stroke-dasharray="8 8" stroke-width="2"/><text x="${X(1)+8}" y="62" style="fill:${Or};font-size:24px">ω₀</text><text x="78" y="62" style="font-size:24px">A terhadap ω/ω₀</text><path d="${d}" fill="none" stroke="#fff" stroke-width="4"/><line x1="${X(v.r)}" x2="${X(v.r)}" y1="330" y2="${Y(A)}" stroke="${Au}" stroke-width="3"/><circle cx="${X(v.r)}" cy="${Y(A)}" r="12" fill="${Au}"/>`+
sp(356,254,Tw,ya,[{f:s=>A*M.cos(w*s-dl),c:Au},{f:s=>v.F/4*M.cos(w*s),c:'#fff',d:1}],'x(t) emas · gaya F/k putus-putus',t)},
rd(v){const w=v.r*2,A=v.F/M.sqrt((4-w*w)**2+(v.b*w)**2),dl=M.atan2(v.b*w,4-w*w);return `ω<sub>0</sub> = <b>2,00</b> rad/s<br>A = <b>${n(A,3)}</b> m<br>δ = <b>${n(dl*180/PI,0)}°</b><br><b>${M.abs(v.r-1)<.06?'Resonansi!':v.r<1?'Di bawah ω₀':'Di atas ω₀'}</b>`}},
{t:'KAPAN BALOK LEPAS KONTAK?',l:'VARIASI · PEGAS VERTIKAL',
v:[['f','Frekuensi f (Hz)',1,8,4,.1],['A','Amplitudo A (cm)',1,15,7,.5]],
draw(t,v){const w=2*PI*v.f,a=w*w*v.A/100,ya=M.max(a,g0)*1.15,Tw=3/v.f,yl=g0/w/w*100;
return sp(10,290,Tw,ya,[{f:s=>-a*M.cos(w*s),c:Au},{f:s=>-a*M.cos(w*s)<-g0?-a*M.cos(w*s):NaN,c:Rd,w:7,n:1},{f:s=>-g0,c:Or,d:1,n:1}],'a (m/s²)  · putus-putus: a = −g · merah: lepas kontak',t)+
sp(316,290,Tw,v.A,[{f:s=>v.A*M.cos(w*s),c:Au},{f:s=>yl,c:Or,d:1,n:1}],'y′ (cm)  · putus-putus: y′ = g/ω²',t)},
rd(v){const w=2*PI*v.f,yl=g0/w/w*100,ok=v.A<=yl;return `ω = <b>${n(w)}</b> rad/s<br>A<sub>maks</sub> tanpa lepas = g/ω² = <b>${n(yl)}</b> cm<br><b style="color:${ok?'#0DFF00':'#FF1F00'}">${ok?'Tidak lepas kontak':'Balok lepas kontak'}</b>${ok?'':`<br>y′ = <b>${n(yl)}</b> cm<br>v = ω√(A²−y′²) = <b>${n(w*M.sqrt(v.A**2-yl**2)/100,2)}</b> m/s`}`}}
];
// ---------- UI ----------
let cur=0,V={},t=0,play=!matchMedia('(prefers-reduced-motion:reduce)').matches,last=0;
const nv=$('nv');PG.forEach((_,i)=>nv.insertAdjacentHTML('beforeend',`<button aria-label="Halaman ${i+1}" onclick="go(${i})"></button>`));
function go(i,w){cur=M.max(0,M.min(PG.length-1,i));const p=PG[cur];t=0;V={};
$('ti').textContent=p.t;$('lb').innerHTML=p.l;$('no').textContent='0'+(cur+1)+' / 0'+PG.length;
$('cl').innerHTML=p.v.map(([id,l,a,b,x,s])=>{V[id]=x;return `<label class="sl"><span>${l}</span><b id="o_${id}">${n(x)}</b><input type="range" id="i_${id}" min="${a}" max="${b}" step="${s}" value="${x}"></label>`}).join('');
p.v.forEach(([id])=>$('i_'+id).oninput=e=>{V[id]=+e.target.value;$('o_'+id).textContent=n(V[id])});
[...nv.children].forEach((b,j)=>b.classList.toggle('on',j==cur));
if(!w)try{history.replaceState(null,'','?page='+(cur+1))}catch(e){}}
const rdp=()=>(parseInt(new URLSearchParams(location.search).get('page')||location.hash.replace('#',''))||1)-1;
$('pp').onclick=()=>{play=!play;$('pp').textContent=play?'Jeda':'Putar'};
function frame(ms){if(play)t+=(ms-last)/1000;last=ms;const p=PG[cur];$('ch').innerHTML=`<svg viewBox="0 0 ${W} 616">${p.draw(t,V)}</svg>`;$('rd').innerHTML=p.rd(V,t);requestAnimationFrame(frame)}
go(rdp(),1);addEventListener('hashchange',()=>go(rdp(),1));addEventListener('popstate',()=>go(rdp(),1));
addEventListener('message',e=>{if(e.data&&e.data.page)go(e.data.page-1)});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(['ArrowRight','PageDown'].includes(e.key))go(cur+1);else if(['ArrowLeft','PageUp'].includes(e.key))go(cur-1);else if(e.key==' '){e.preventDefault();$('pp').click()}});
const fit=()=>$('st').style.setProperty('--k',M.min(innerWidth/1920,innerHeight/1080));addEventListener('resize',fit);fit();
requestAnimationFrame(frame);
</script></body></html>
